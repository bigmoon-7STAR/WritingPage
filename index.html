<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- スマホ・タブレットでのWebアプリ化（PWA）用の設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>もちもちライター</title>

    <style>
        :root {
            /* 画面上部（ヘッダー＆記号バー）用の彩度0（モノトーン）カラー定義 */
            --top-bg: rgba(255, 255, 255, 0.75);
            --top-border: rgba(200, 200, 200, 0.4);
            --top-text-primary: #121212;
            --top-text-secondary: #555555;
            --top-btn-bg: rgba(240, 240, 240, 0.8);
            --top-btn-hover: #121212;
            --top-btn-hover-text: #ffffff;

            /* ユーザーカスタマイズ可能なエディタ・背景用カラー（デフォルト設定） */
            --bg-gradient-1: #f8fafc;
            --bg-gradient-2: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            
            /* UI用のシャドウとフォント */
            --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-btn: 0 2px 8px rgba(0, 0, 0, 0.05);
            --editor-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            --editor-font-size: 1.15rem;
            --editor-line-height: 1.85;
            --editor-width: 100%;
            --mascot-size: 130px;
        }

        /* ダークモード時の彩度0上部スタイル調整 */
        @media (prefers-color-scheme: dark) {
            :root {
                --top-bg: rgba(20, 20, 20, 0.75);
                --top-border: rgba(255, 255, 255, 0.15);
                --top-text-primary: #f0f0f0;
                --top-text-secondary: #aaaaaa;
                --top-btn-bg: rgba(40, 40, 40, 0.8);
                --top-btn-hover: #ffffff;
                --top-btn-hover-text: #121212;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* スクロールはテキストエリアのみ */
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            font-family: var(--editor-font);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--top-bg);
            backdrop-filter: blur(20px) saturate(0%);
            -webkit-backdrop-filter: blur(20px) saturate(0%);
            border-bottom: 1px solid var(--top-border);
            z-index: 10;
            flex-shrink: 0;
        }

        .char-counter {
            font-size: 0.85rem;
            color: var(--top-text-secondary);
            font-variant-numeric: tabular-nums;
            background: var(--top-btn-bg);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 0.03em;
            border: 1px solid var(--top-border);
        }

        .settings-btn {
            background: var(--top-btn-bg);
            border: 1px solid var(--top-border);
            color: var(--top-text-primary);
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: var(--shadow-btn);
            outline: none;
            user-select: none;
        }

        .settings-btn:hover {
            background: var(--top-btn-hover);
            color: var(--top-btn-hover-text);
            transform: translateY(-1px);
        }

        .settings-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .settings-btn:hover svg {
            transform: rotate(60deg);
        }

        /* 彩度0の記号ショートカットバー */
        .symbol-bar {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: var(--top-bg);
            backdrop-filter: blur(16px) saturate(0%);
            -webkit-backdrop-filter: blur(16px) saturate(0%);
            border-bottom: 1px solid var(--top-border);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            z-index: 5;
            flex-shrink: 0;
        }

        .symbol-bar::-webkit-scrollbar {
            display: none; /* スクロールバー非表示 */
        }

        .symbol-btn {
            background: var(--top-btn-bg);
            border: 1px solid var(--top-border);
            color: var(--top-text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: var(--shadow-btn);
            user-select: none;
            flex-shrink: 0;
        }

        .symbol-btn:hover {
            background: var(--top-btn-hover);
            color: var(--top-btn-hover-text);
        }

        .symbol-btn:active {
            transform: scale(0.93);
        }

        main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            justify-content: center;
        }

        textarea {
            width: 100%;
            max-width: var(--editor-width);
            margin: 0 auto;
            display: block;
            height: 100%;
            padding: 28px 32px;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--editor-font);
            font-size: var(--editor-font-size);
            line-height: var(--editor-line-height);
            color: var(--text-primary);
            resize: none;
            box-sizing: border-box;
            word-break: break-word;
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-weight: 400;
        }

        /* ドラッグ対応マスコットコンテナ */
        .mascot-container {
            position: absolute;
            width: var(--mascot-size);
            height: var(--mascot-size);
            top: 24px;
            right: 24px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.12));
            will-change: transform;
            transform-origin: center bottom;
        }

        .mascot-container:active {
            cursor: grabbing;
        }

        .mascot-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            pointer-events: none;
        }

        .mascot-img.active {
            display: block;
        }

        .mascot-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-subtle);
            pointer-events: none;
        }

        .mascot-fallback-face {
            font-size: 3.2rem;
            line-height: 1;
        }

        .mascot-fallback-hand {
            font-size: 0.95rem;
            margin-top: -2px;
            font-weight: bold;
            color: var(--text-secondary);
        }

        /* もちもち・弾力キーボードアニメーション */
        .squish-anim {
            animation: gentle-mochi 0.38s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes gentle-mochi {
            0%   { transform: scale(1, 1) translateY(0); }
            35%  { transform: scale(1.06, 0.94) translateY(3px); }
            70%  { transform: scale(0.98, 1.02) translateY(-1px); }
            100% { transform: scale(1, 1) translateY(0); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.05); /* エディタ画面を透かして見るための極薄オーバーレイ */
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* 右寄せサイドパネル風 */
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* すりガラス（Glassmorphism）効果のカスタマイズ設定カード */
        .modal-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            width: 90%;
            max-width: 380px;
            max-height: calc(100vh - 32px);
            height: 100%;
            border-radius: 24px;
            padding: 24px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            border: 1px solid rgba(255, 255, 255, 0.35);
            overflow-y: auto;
            transform: translateX(40px); /* 右からスライドイン */
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        @media (prefers-color-scheme: dark) {
            .modal-card {
                background: rgba(30, 30, 35, 0.65);
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            }
        }

        .modal-overlay.active .modal-card {
            transform: translateX(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            background: rgba(150, 150, 150, 0.18);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(150, 150, 150, 0.3);
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* HSL色相・彩度・明度スライダーグループ */
        .color-slider-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.35);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-top: 6px;
        }

        @media (prefers-color-scheme: dark) {
            .color-slider-group {
                background: rgba(0, 0, 0, 0.25);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

        .color-slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .color-slider-row span:first-child { width: 55px; font-weight: 600; }
        .color-slider-row span:last-child { width: 45px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
        
        .range-slider {
            width: 100%;
            accent-color: var(--text-primary);
            cursor: pointer;
        }

        select#editor-font {
            flex: 1;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(150, 150, 150, 0.3);
            background: rgba(255, 255, 255, 0.4);
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            select#editor-font {
                background: rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
        }

        .btn-sub-reset {
            background: transparent;
            border: 1px solid rgba(150, 150, 150, 0.3);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-sub-reset:hover {
            background: rgba(150, 150, 150, 0.2);
        }

        /* 画像選択UI */
        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px dashed rgba(150, 150, 150, 0.4);
            padding: 10px 14px;
            border-radius: 16px;
            transition: border-color 0.2s ease;
        }

        @media (prefers-color-scheme: dark) {
            .file-input-wrapper {
                background: rgba(0, 0, 0, 0.25);
            }
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .file-preview-thumb {
            width: 38px; height: 38px;
            border-radius: 10px; object-fit: contain;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(150, 150, 150, 0.2);
        }

        .file-input-text {
            font-size: 0.82rem; color: var(--text-primary); opacity: 0.8;
            flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-action {
            width: 100%; padding: 13px; border-radius: 16px; border: none;
            background: var(--text-primary); color: var(--bg-gradient-1); font-size: 0.92rem;
            font-weight: 700; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); margin-top: 10px;
        }

        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-danger { background: #ef4444; color: #ffffff; margin-top: 8px; }

        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(18, 18, 18, 0.92); color: #ffffff;
            padding: 11px 24px; border-radius: 30px;
            font-size: 0.88rem; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200; pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 上部ナビゲーション（彩度0固定） -->
        <header>
            <div class="header-left">
                <span class="char-counter" id="char-count">0 文字</span>
            </div>
            <button class="settings-btn" id="btn-open-settings" aria-label="設定">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>設定</span>
            </button>
        </header>

        <!-- 記号ショートカットバー（彩度0・一連の指定記号） -->
        <div class="symbol-bar">
            <button class="symbol-btn" onclick="insertSymbol('「', '」')">「」</button>
            <button class="symbol-btn" onclick="insertSymbol('・・・')">・・・</button>
            <button class="symbol-btn" onclick="insertSymbol('＊＊＊')">＊＊＊</button>
            <button class="symbol-btn" onclick="insertSymbol('……')">……</button>
            <button class="symbol-btn" onclick="insertSymbol('(', ')')">()</button>
            <button class="symbol-btn" onclick="insertSymbol('［', '］')">［］</button>
            <button class="symbol-btn" onclick="insertSymbol('【', '】')">【】</button>
            <button class="symbol-btn" onclick="insertSymbol('─')">─</button>
            <button class="symbol-btn" onclick="insertSymbol('■')">■</button>
            <button class="symbol-btn" onclick="insertSymbol('X')">X</button>
            <button class="symbol-btn" onclick="insertSymbol('&quot;', '&quot;')">""</button>
            <button class="symbol-btn" onclick="insertSymbol('\'', '\'')">''</button>
        </div>

        <main>
            <!-- エディタ本体 -->
            <textarea id="editor" placeholder="ここに文字を入力してください...&#10;キー入力に連動してミニキャラがトントン・もちもち弾みます！" autofocus></textarea>

            <!-- マスコットコンテナ（ドラッグ移動可能） -->
            <div class="mascot-container" id="mascot-container">
                <img id="mascot-idle" class="mascot-img active" alt="待機中">
                <img id="mascot-right" class="mascot-img" alt="右手打鍵">
                <img id="mascot-left" class="mascot-img" alt="左手打鍵">
                <div id="mascot-fallback" class="mascot-fallback" style="display: none;">
                    <div class="mascot-fallback-face" id="fallback-face">🐰</div>
                    <div class="mascot-fallback-hand" id="fallback-hand">♪</div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-settings">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">カスタマイズ設定</span>
                <button class="close-btn" id="btn-close-settings" aria-label="閉じる">✕</button>
            </div>

            <div class="setting-group">
                <label class="setting-label">
                    <span>キャラクターサイズ</span>
                    <span id="size-value" style="font-weight:normal; font-size:0.8rem; opacity:0.8;">130px</span>
                </label>
                <input type="range" id="input-mascot-size" class="range-slider" min="80" max="220" step="5" value="130">
            </div>

            <!-- エディタ表示設定（文字画面を見ながら調整可能） -->
            <div class="setting-group">
                <div class="setting-label">
                    <span>エディタ表示設定</span>
                    <button class="btn-sub-reset" id="btn-reset-editor">リセット</button>
                </div>
                <div class="color-slider-group">
                    <div class="color-slider-row">
                        <span style="width:70px">サイズ</span>
                        <input type="range" id="editor-size" class="range-slider" min="14" max="32" value="18">
                        <span id="editor-size-val">18px</span>
                    </div>
                    <div class="color-slider-row">
                        <span style="width:70px">行間</span>
                        <input type="range" id="editor-lh" class="range-slider" min="1.0" max="3.0" step="0.1" value="1.8">
                        <span id="editor-lh-val">1.8</span>
                    </div>
                    <div class="color-slider-row">
                        <span style="width:70px">文章の幅</span>
                        <input type="range" id="editor-width" class="range-slider" min="50" max="100" value="100">
                        <span id="editor-width-val">100%</span>
                    </div>
                    <div class="color-slider-row" style="margin-top: 6px; align-items: stretch;">
                        <span style="width:70px; display:flex; align-items:center;">フォント</span>
                        <select id="editor-font">
                            <option value='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'>システム標準</option>
                            <option value='"Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'>ゴシック体</option>
                            <option value='"Hiragino Mincho ProN", "MS PMincho", serif'>明朝体</option>
                            <option value='"Hiragino Maru Gothic ProN", sans-serif'>丸ゴシック体</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 背景色カスタム（色相 H / 彩度 S / 明度 L） -->
            <div class="setting-group">
                <div class="setting-label">
                    <span>背景色 (色相 / 彩度 / 明度)</span>
                    <button class="btn-sub-reset" id="btn-reset-bg-color">リセット</button>
                </div>
                <div class="color-slider-group">
                    <div class="color-slider-row"><span>色相 H</span><input type="range" id="bg-h" class="range-slider" min="0" max="360" value="210"><span id="bg-h-val">210°</span></div>
                    <div class="color-slider-row"><span>彩度 S</span><input type="range" id="bg-s" class="range-slider" min="0" max="100" value="40"><span id="bg-s-val">40%</span></div>
                    <div class="color-slider-row"><span>明度 L</span><input type="range" id="bg-l" class="range-slider" min="0" max="100" value="98"><span id="bg-l-val">98%</span></div>
                </div>
            </div>

            <!-- テキスト色カスタム（色相 H / 彩度 S / 明度 L） -->
            <div class="setting-group">
                <div class="setting-label">
                    <span>テキスト色 (色相 / 彩度 / 明度)</span>
                    <button class="btn-sub-reset" id="btn-reset-text-color">リセット</button>
                </div>
                <div class="color-slider-group">
                    <div class="color-slider-row"><span>色相 H</span><input type="range" id="text-h" class="range-slider" min="0" max="360" value="215"><span id="text-h-val">215°</span></div>
                    <div class="color-slider-row"><span>彩度 S</span><input type="range" id="text-s" class="range-slider" min="0" max="100" value="28"><span id="text-s-val">28%</span></div>
                    <div class="color-slider-row"><span>明度 L</span><input type="range" id="text-l" class="range-slider" min="0" max="100" value="17"><span id="text-l-val">17%</span></div>
                </div>
            </div>

            <!-- 画像設定 -->
            <div class="setting-group">
                <label class="setting-label">待機中の画像</label>
                <div class="file-input-wrapper">
                    <img id="prev-idle" class="file-preview-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23f1f5f9'/></svg>">
                    <span class="file-input-text" id="name-idle">画像を選択...</span>
                    <input type="file" id="input-idle" accept="image/*">
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">右手で叩く画像</label>
                <div class="file-input-wrapper">
                    <img id="prev-right" class="file-preview-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23f1f5f9'/></svg>">
                    <span class="file-input-text" id="name-right">画像を選択...</span>
                    <input type="file" id="input-right" accept="image/*">
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">左手で叩く画像</label>
                <div class="file-input-wrapper">
                    <img id="prev-left" class="file-preview-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23f1f5f9'/></svg>">
                    <span class="file-input-text" id="name-left">画像を選択...</span>
                    <input type="file" id="input-left" accept="image/*">
                </div>
            </div>

            <button class="btn-action" id="btn-copy-text">📋 全文をコピーして Nola へ</button>
            <button class="btn-action btn-danger" id="btn-reset-images">画像を初期化</button>
        </div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>

    <script>
        const KEYS = {
            TEXT: 'gh_mochi_text',
            POS_IDLE: 'gh_mochi_img_idle',
            POS_RIGHT: 'gh_mochi_img_right',
            POS_LEFT: 'gh_mochi_img_left',
            POSITION: 'gh_mochi_pos',
            SIZE: 'gh_mochi_size',
            COLOR_BG: 'gh_mochi_color_bg',
            COLOR_TEXT: 'gh_mochi_color_text',
            EDITOR_STYLE: 'gh_mochi_editor_style'
        };

        const DEFAULT_COLORS = {
            bg: { h: 210, s: 40, l: 98 },
            text: { h: 215, s: 28, l: 17 }
        };

        const DEFAULT_EDITOR = {
            size: 18,
            lh: 1.85,
            width: 100,
            font: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
        };

        const IDLE_TIMEOUT_MS = 450;
        const MAX_IMAGE_DIM = 240;

        const IGNORED_KEYS = new Set([
            'Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Escape',
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
            'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
            'Fn', 'ContextMenu'
        ]);

        function storageGet(key, defaultValue = null) {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? val : defaultValue;
            } catch (e) {
                return defaultValue;
            }
        }

        function storageSet(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                return false;
            }
        }

        function storageRemove(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        }

        const mascotState = {
            images: { idle: null, right: null, left: null },
            currentHand: 'right',
            idleTimer: null,
            isDragging: false,
            dragOffset: { x: 0, y: 0 },
            position: { x: 24, y: 24 }
        };

        const editor = document.getElementById('editor');
        const charCount = document.getElementById('char-count');
        const mascotContainer = document.getElementById('mascot-container');
        const imgIdle = document.getElementById('mascot-idle');
        const imgRight = document.getElementById('mascot-right');
        const imgLeft = document.getElementById('mascot-left');
        const mascotFallback = document.getElementById('mascot-fallback');
        
        const modalSettings = document.getElementById('modal-settings');
        const btnOpenSettings = document.getElementById('btn-open-settings');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        const btnCopyText = document.getElementById('btn-copy-text');
        const btnResetImages = document.getElementById('btn-reset-images');
        const inputMascotSize = document.getElementById('input-mascot-size');
        const toast = document.getElementById('toast');

        function initEditor() {
            editor.value = storageGet(KEYS.TEXT, '');
            updateCharCount();

            editor.addEventListener('input', () => {
                storageSet(KEYS.TEXT, editor.value);
                updateCharCount();
            });

            editor.addEventListener('keydown', (e) => {
                if (IGNORED_KEYS.has(e.key)) return;
                triggerMascotAnimation();
            });
        }

        function updateCharCount() {
            charCount.textContent = `${editor.value.length.toLocaleString()} 文字`;
        }

        function triggerMascotAnimation() {
            mascotState.currentHand = (mascotState.currentHand === 'right') ? 'left' : 'right';
            setMascotPose(mascotState.currentHand);

            mascotContainer.classList.remove('squish-anim');
            void mascotContainer.offsetWidth; 
            mascotContainer.classList.add('squish-anim');

            clearTimeout(mascotState.idleTimer);
            mascotState.idleTimer = setTimeout(() => {
                setMascotPose('idle');
            }, IDLE_TIMEOUT_MS);
        }

        function setMascotPose(pose) {
            const hasCustom = mascotState.images.idle || mascotState.images.right || mascotState.images.left;

            if (hasCustom) {
                mascotFallback.style.display = 'none';
                imgIdle.classList.toggle('active', pose === 'idle');
                imgRight.classList.toggle('active', pose === 'right');
                imgLeft.classList.toggle('active', pose === 'left');
            } else {
                imgIdle.classList.remove('active');
                imgRight.classList.remove('active');
                imgLeft.classList.remove('active');
                mascotFallback.style.display = 'flex';
                
                document.getElementById('fallback-face').textContent = pose === 'idle' ? '🐰' : (pose === 'right' ? '🪘' : '🥁');
                document.getElementById('fallback-hand').textContent = pose === 'idle' ? '♪' : (pose === 'right' ? '👉' : '👈');
            }
        }

        function initDraggableMascot() {
            const savedPos = storageGet(KEYS.POSITION);
            if (savedPos) {
                try { mascotState.position = JSON.parse(savedPos); } catch (e) {}
            }
            applyMascotPosition();

            mascotContainer.addEventListener('pointerdown', (e) => {
                mascotState.isDragging = true;
                try { mascotContainer.setPointerCapture(e.pointerId); } catch (err) {}
                mascotState.dragOffset = {
                    x: e.clientX - mascotState.position.x,
                    y: e.clientY - mascotState.position.y
                };
                e.preventDefault();
            });

            mascotContainer.addEventListener('pointermove', (e) => {
                if (!mascotState.isDragging) return;
                let newX = e.clientX - mascotState.dragOffset.x;
                let newY = e.clientY - mascotState.dragOffset.y;
                
                newX = Math.max(0, Math.min(newX, window.innerWidth - mascotContainer.offsetWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - mascotContainer.offsetHeight));

                mascotState.position = { x: newX, y: newY };
                applyMascotPosition();
            });

            const stopDrag = (e) => {
                if (mascotState.isDragging) {
                    mascotState.isDragging = false;
                    try { mascotContainer.releasePointerCapture(e.pointerId); } catch (err) {}
                    storageSet(KEYS.POSITION, JSON.stringify(mascotState.position));
                }
            };
            mascotContainer.addEventListener('pointerup', stopDrag);
            mascotContainer.addEventListener('pointercancel', stopDrag);
        }

        function applyMascotPosition() {
            mascotContainer.style.left = `${mascotState.position.x}px`;
            mascotContainer.style.top = `${mascotState.position.y}px`;
            mascotContainer.style.right = 'auto';
        }

        /* ワンタップ記号入力機能（括弧等のカーソル自動配置対応） */
        function insertSymbol(openSymbol, closeSymbol = '') {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const selectedText = text.substring(start, end);

            let inserted = '';
            let newCursorPos = start;

            if (closeSymbol) {
                inserted = openSymbol + selectedText + closeSymbol;
                newCursorPos = selectedText.length > 0 ? start + inserted.length : start + openSymbol.length;
            } else {
                inserted = openSymbol;
                newCursorPos = start + inserted.length;
            }

            editor.value = text.substring(0, start) + inserted + text.substring(end);
            storageSet(KEYS.TEXT, editor.value);
            updateCharCount();
            
            editor.focus();
            editor.setSelectionRange(newCursorPos, newCursorPos);
            triggerMascotAnimation();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function initColorSettings() {
            const bg = JSON.parse(storageGet(KEYS.COLOR_BG)) || { ...DEFAULT_COLORS.bg };
            const text = JSON.parse(storageGet(KEYS.COLOR_TEXT)) || { ...DEFAULT_COLORS.text };

            const bgSliders = { h: document.getElementById('bg-h'), s: document.getElementById('bg-s'), l: document.getElementById('bg-l') };
            const txtSliders = { h: document.getElementById('text-h'), s: document.getElementById('text-s'), l: document.getElementById('text-l') };

            function setSliderValues(b, t) {
                bgSliders.h.value = b.h; bgSliders.s.value = b.s; bgSliders.l.value = b.l;
                txtSliders.h.value = t.h; txtSliders.s.value = t.s; txtSliders.l.value = t.l;
                applyColors(b, t);
            }
            
            function updateFromSliders() {
                const currentBg = { h: parseInt(bgSliders.h.value), s: parseInt(bgSliders.s.value), l: parseInt(bgSliders.l.value) };
                const currentTxt = { h: parseInt(txtSliders.h.value), s: parseInt(txtSliders.s.value), l: parseInt(txtSliders.l.value) };
                applyColors(currentBg, currentTxt);
                storageSet(KEYS.COLOR_BG, JSON.stringify(currentBg));
                storageSet(KEYS.COLOR_TEXT, JSON.stringify(currentTxt));
            }

            ['h','s','l'].forEach(k => {
                bgSliders[k].addEventListener('input', updateFromSliders);
                txtSliders[k].addEventListener('input', updateFromSliders);
            });

            document.getElementById('btn-reset-bg-color').addEventListener('click', () => {
                bgSliders.h.value = DEFAULT_COLORS.bg.h; bgSliders.s.value = DEFAULT_COLORS.bg.s; bgSliders.l.value = DEFAULT_COLORS.bg.l;
                updateFromSliders();
            });
            document.getElementById('btn-reset-text-color').addEventListener('click', () => {
                txtSliders.h.value = DEFAULT_COLORS.text.h; txtSliders.s.value = DEFAULT_COLORS.text.s; txtSliders.l.value = DEFAULT_COLORS.text.l;
                updateFromSliders();
            });

            setSliderValues(bg, text);
        }

        function applyColors(bg, text) {
            document.getElementById('bg-h-val').textContent = `${bg.h}°`; document.getElementById('bg-s-val').textContent = `${bg.s}%`; document.getElementById('bg-l-val').textContent = `${bg.l}%`;
            document.getElementById('text-h-val').textContent = `${text.h}°`; document.getElementById('text-s-val').textContent = `${text.s}%`; document.getElementById('text-l-val').textContent = `${text.l}%`;

            const root = document.documentElement;
            root.style.setProperty('--bg-gradient-1', `hsl(${bg.h}, ${bg.s}%, ${bg.l}%)`);
            root.style.setProperty('--bg-gradient-2', `hsl(${(bg.h + 15) % 360}, ${bg.s}%, ${Math.max(0, bg.l - 4)}%)`);
            root.style.setProperty('--text-primary', `hsl(${text.h}, ${text.s}%, ${text.l}%)`);
            root.style.setProperty('--text-secondary', `hsl(${text.h}, ${Math.max(0, text.s - 10)}%, ${Math.min(100, text.l + 25)}%)`);
        }

        function initEditorSettings() {
            const saved = JSON.parse(storageGet(KEYS.EDITOR_STYLE)) || { ...DEFAULT_EDITOR };
            
            const elSize = document.getElementById('editor-size');
            const elLh = document.getElementById('editor-lh');
            const elWidth = document.getElementById('editor-width');
            const elFont = document.getElementById('editor-font');

            function updateEditorStyle() {
                const vals = {
                    size: parseFloat(elSize.value),
                    lh: parseFloat(elLh.value),
                    width: parseInt(elWidth.value),
                    font: elFont.value
                };
                
                document.getElementById('editor-size-val').textContent = `${vals.size}px`;
                document.getElementById('editor-lh-val').textContent = `${vals.lh}`;
                document.getElementById('editor-width-val').textContent = `${vals.width}%`;

                const root = document.documentElement;
                root.style.setProperty('--editor-font-size', `${vals.size}px`);
                root.style.setProperty('--editor-line-height', `${vals.lh}`);
                root.style.setProperty('--editor-width', `${vals.width}%`);
                root.style.setProperty('--editor-font', vals.font);

                storageSet(KEYS.EDITOR_STYLE, JSON.stringify(vals));
            }

            elSize.addEventListener('input', updateEditorStyle);
            elLh.addEventListener('input', updateEditorStyle);
            elWidth.addEventListener('input', updateEditorStyle);
            elFont.addEventListener('change', updateEditorStyle);

            document.getElementById('btn-reset-editor').addEventListener('click', () => {
                elSize.value = DEFAULT_EDITOR.size;
                elLh.value = DEFAULT_EDITOR.lh;
                elWidth.value = DEFAULT_EDITOR.width;
                elFont.value = DEFAULT_EDITOR.font;
                updateEditorStyle();
            });

            elSize.value = saved.size || DEFAULT_EDITOR.size;
            elLh.value = saved.lh || DEFAULT_EDITOR.lh;
            elWidth.value = saved.width || DEFAULT_EDITOR.width;
            elFont.value = saved.font || DEFAULT_EDITOR.font;
            updateEditorStyle();
        }

        function initImageSettings() {
            loadSavedImages();
            setupFileInput('input-idle', 'prev-idle', 'name-idle', KEYS.POS_IDLE, 'idle');
            setupFileInput('input-right', 'prev-right', 'name-right', KEYS.POS_RIGHT, 'right');
            setupFileInput('input-left', 'prev-left', 'name-left', KEYS.POS_LEFT, 'left');

            btnResetImages.addEventListener('click', () => {
                storageRemove(KEYS.POS_IDLE); storageRemove(KEYS.POS_RIGHT); storageRemove(KEYS.POS_LEFT);
                mascotState.images = { idle: null, right: null, left: null };
                const blankSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23f1f5f9'/></svg>";
                ['idle', 'right', 'left'].forEach(k => {
                    document.getElementById(`mascot-${k}`).src = '';
                    document.getElementById(`prev-${k}`).src = blankSvg;
                    document.getElementById(`name-${k}`).textContent = '画像を選択...';
                });
                setMascotPose('idle');
                showToast('画像を初期化しました');
            });
        }

        function loadSavedImages() {
            ['idle', 'right', 'left'].forEach(k => {
                const data = storageGet(KEYS[`POS_${k.toUpperCase()}`]);
                mascotState.images[k] = data;
                if (data) {
                    document.getElementById(`mascot-${k}`).src = data;
                    document.getElementById(`prev-${k}`).src = data;
                    document.getElementById(`name-${k}`).textContent = '設定済み';
                }
            });
            setMascotPose('idle');
        }

        function setupFileInput(inputId, prevId, nameId, storageKey, poseKey) {
            document.getElementById(inputId).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                document.getElementById(nameId).textContent = file.name;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX_IMAGE_DIM) { h = Math.round(h * MAX_IMAGE_DIM / w); w = MAX_IMAGE_DIM; }
                        else if (h > MAX_IMAGE_DIM) { w = Math.round(w * MAX_IMAGE_DIM / h); h = MAX_IMAGE_DIM; }
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        
                        const compressedData = canvas.toDataURL('image/png', 0.85);
                        document.getElementById(prevId).src = compressedData;
                        document.getElementById(`mascot-${poseKey}`).src = compressedData;
                        
                        storageSet(storageKey, compressedData);
                        mascotState.images[poseKey] = compressedData;
                        setMascotPose('idle');
                        showToast('画像を保存しました！');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function initUI() {
            btnOpenSettings.addEventListener('click', () => modalSettings.classList.add('active'));
            btnCloseSettings.addEventListener('click', () => modalSettings.classList.remove('active'));
            modalSettings.addEventListener('click', (e) => {
                if (e.target === modalSettings) modalSettings.classList.remove('active');
            });

            btnCopyText.addEventListener('click', () => {
                const text = editor.value;
                if (!text) return showToast('コピーする文章がありません');
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast('全文コピーしました！'))
                    .catch(() => fallbackCopyText(text));
                } else {
                    fallbackCopyText(text);
                }
            });

            const savedSize = storageGet(KEYS.SIZE, '130');
            inputMascotSize.value = savedSize;
            document.documentElement.style.setProperty('--mascot-size', `${savedSize}px`);
            document.getElementById('size-value').textContent = `${savedSize}px`;

            inputMascotSize.addEventListener('input', (e) => {
                const val = e.target.value;
                document.documentElement.style.setProperty('--mascot-size', `${val}px`);
                document.getElementById('size-value').textContent = `${val}px`;
                storageSet(KEYS.SIZE, val);
            });
        }

        function fallbackCopyText(text) {
            editor.focus(); editor.select();
            try {
                document.execCommand('copy') ? showToast('全文コピーしました！') : showToast('テキストを選択してコピーしてください');
            } catch (err) { showToast('全選択しました。手動でコピーしてください'); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initEditor();
            initDraggableMascot();
            initColorSettings();
            initEditorSettings();
            initImageSettings();
            initUI();
        });
    </script>
</body>
</html>
